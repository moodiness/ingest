name: Verify and release Ingest

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Go, PostgreSQL, frontend, browser and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      INGEST_TEST_DATABASE_URL: postgresql://ingest:ingest@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ingest
          POSTGRES_PASSWORD: ingest
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ingest -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out full repository history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            torznab/go.sum
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let version = 'dev';
          let prerelease = false;
          if (process.env.EVENT_NAME === 'push' && process.env.REF_TYPE === 'tag') {
            // SemVer without build metadata: '+' cannot be used in a Docker tag.
            const core = '(0|[1-9][0-9]*)';
            const identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)';
            const pattern = new RegExp(`^v${core}\\.${core}\\.${core}(?:-(${identifier}(?:\\.${identifier})*))?$`);
            const match = pattern.exec(process.env.REF_NAME);
            if (!match) {
              throw new Error('Release tags must be vMAJOR.MINOR.PATCH[-PRERELEASE], without build metadata.');
            }
            version = process.env.REF_NAME.slice(1);
            if (`sha-${process.env.GITHUB_SHA}-${version}`.length > 128) {
              throw new Error('Version-qualified commit image tag exceeds Docker’s 128-character limit.');
            }
            prerelease = Boolean(match[4]);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nprerelease=${prerelease}\n`);
          NODE
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l cmd internal web/*.go torznab)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Build frontend and run behavioral checks
        run: make check
      - name: Scan Git history and Go/frontend dependencies
        run: make security
      - name: Verify embedded application
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go build -tags production -trimpath -ldflags "-X main.version=${VERSION}" -o bin/ingest ./cmd/ingest
          test "$(./bin/ingest version)" = "$VERSION"
          ./bin/ingest help
      - name: Install Chromium and browser dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Exercise production source editor in Chromium
        env:
          INGEST_E2E_BINARY: ../bin/ingest
        run: make e2e
      - name: Validate deployment definitions
        run: |
          make compose-check
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/publish-image.yml
          docker run --rm -i \
            ghcr.io/hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e \
            < Dockerfile

  image:
    name: Verify native image and multi-platform build without publishing
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and smoke test without publishing
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: make image-check

  publish:
    name: Publish versioned multi-platform GHCR image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ghcr-ingest-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
      - name: Refuse overwriting version or version-qualified commit tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          token="$(curl --fail --silent --show-error \
            --user "${GH_ACTOR}:${GH_TOKEN}" --get \
            --data-urlencode service=ghcr.io \
            --data-urlencode "scope=repository:${repository}:pull,push" \
            https://ghcr.io/token | jq --exit-status --raw-output .token)"
          echo "::add-mask::${token}"
          for tag in "$VERSION" "sha-${GITHUB_SHA}-${VERSION}"; do
            status="$(curl --silent --show-error --head --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${repository}/manifests/${tag}")"
            case "$status" in
              404) ;;
              200) echo "Refusing to overwrite existing image tag ${tag}"; exit 1 ;;
              *) echo "Cannot verify image tag ${tag}: HTTP ${status}"; exit 1 ;;
            esac
          done
      - name: Select release tags
        id: tags
        env:
          VERSION: ${{ needs.quality.outputs.version }}
          PRERELEASE: ${{ needs.quality.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "${image}:${VERSION}"
            echo "${image}:sha-${GITHUB_SHA}-${VERSION}"
            if [ "$PRERELEASE" = false ]; then
              echo "${image}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Publish both platforms with native attestations
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ needs.quality.outputs.version }}
          labels: |
            org.opencontainers.image.title=Ingest
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.quality.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub release notes
    needs: [quality, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release for the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.quality.outputs.version }}
          PRERELEASE: ${{ needs.quality.outputs.prerelease }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "Ingest ${VERSION}" \
            --notes "Container: ghcr.io/${GH_REPO,,}:${VERSION} (linux/amd64, linux/arm64). Digest: ${DIGEST}." \
            "${flags[@]}"
